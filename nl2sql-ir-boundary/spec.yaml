task_id: nl2sql-ir-boundary
package: boundary_nl2sql
domain: NLP & Semantic Parsing
keywords: [text-to-sql, schema-linking, cross-schema-generalization]
difficulty_explanation: >-
  Replace a pure lexical schema linker with one that generalizes across
  paraphrase and cross-schema/join shifts, while encoder, decoder, data
  generation, and training stay fixed.

lever:
  file: boundary_nl2sql/synthesizer.py
  edit: { start: 33, end: 54 }

metric:
  primary: execution_accuracy
  secondary: component_match
  direction: higher
  bound: 1.0
  aggregate: gmean 

settings:
  - label: a
    hidden: false
    comment: In-schema, 40% paraphrase, tiers 1-2 (select + aggregate/group-by).
    cmd: python -m boundary_nl2sql.run --setting a --seed ${SEED:-0} --epochs ${EPOCHS:-25}
  - label: b
    hidden: false
    comment: Cross-schema (fresh schema), 40% paraphrase, tiers 1-2.
    cmd: python -m boundary_nl2sql.run --setting b --seed ${SEED:-0} --epochs ${EPOCHS:-25}
  - label: c
    hidden: true
    comment: Cross-schema + join tier 3 — the hidden distribution shift.
    cmd: python -m boundary_nl2sql.run --setting c --seed ${SEED:-0} --epochs ${EPOCHS:-25}

baselines: [weak, middle, strong]
oracle_description: >-
  strong -- lexical string-match fused with a learned bilinear attention plus
  a table-membership boost (RAT-SQL / IRNet-style schema linking).
score_spec_doc: >-
  execution_accuracy and component_match per setting, normalized against the
  weak/strong anchors in leaderboard.csv, aggregated across the three settings.
parser_doc: |-
  Reads TEST_METRICS: <execution_accuracy> <component_match>
  emitted by run.py, keyed by setting label.

seeds: [0]
populate_epochs: 25

resources:
  agent_timeout_sec: 32400
  verifier_timeout_sec: 14400
  build_timeout_sec: 3600
  cpus: 2
  memory_mb: 4096
  storage_mb: 20480
  gpus: 0
  allow_internet: true